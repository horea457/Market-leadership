name: Update market leadership data

on:
  workflow_dispatch:
  schedule:
    # 매주 금요일 22:30 UTC = 토요일 07:30 KST
    - cron: "30 22 * * 5"

permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest

    env:
      # Secret이 없어도 절대 빈 User-Agent가 되지 않게 공개 repo URL을 기본 식별자로 사용
      SEC_USER_AGENT: "MarketLeadershipDashboard/1.0 contact:https://github.com/${{ github.repository }}"
      ALPHAVANTAGE_API_KEY: ${{ secrets.ALPHAVANTAGE_API_KEY }}
      GITHUB_REPOSITORY: ${{ github.repository }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run market leadership pipeline
        run: |
          python run_pipeline.py
          python run_v627_addons.py

      - name: Commit updated processed data
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/processed

          if [ -f data/raw/sp500_constituents.csv ]; then
            git add data/raw/sp500_constituents.csv
          fi

          if [ -f data/raw/sec_issuer_quality_cache.csv ]; then
            git add data/raw/sec_issuer_quality_cache.csv
          fi

          if [ -f data/raw/sec_primary_supply_filings_cache.csv ]; then
            git add data/raw/sec_primary_supply_filings_cache.csv
          fi

          if git diff --cached --quiet; then
            echo "No data changes."
            exit 0
          fi

          git commit -m "Update market leadership data"
          git push
