name: Update market leadership data

on:
  workflow_dispatch:
  schedule:
    # Friday 22:30 UTC = Saturday 07:30 KST
    - cron: "30 22 * * 5"

permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Restore research API cache
        uses: actions/cache@v4
        with:
          path: |
            data/raw/sec_companyfacts
            data/raw/sec_full_index
            data/raw/alphavantage
            data/raw/research_validation
          key: research-cache-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            research-cache-${{ runner.os }}-

      - name: Run pipeline
        env:
          # Optional. Without this key the earnings-revision module skips cleanly.
          ALPHAVANTAGE_API_KEY: ${{ secrets.ALPHAVANTAGE_API_KEY }}
          EARNINGS_NAMES_PER_SECTOR: ${{ vars.EARNINGS_NAMES_PER_SECTOR || '1' }}
          # Optional override; SEC does not require an API key.
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
        run: python run_pipeline.py

      - name: Commit updated processed data
        shell: bash
        run: |
          if git diff --quiet -- data/processed data/raw/sp500_constituents.csv; then
            echo "No data changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/processed
          if [ -f data/raw/sp500_constituents.csv ]; then
            git add data/raw/sp500_constituents.csv
          fi
          git commit -m "Update market leadership research data"
          git push
